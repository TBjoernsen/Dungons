# =====================================================================
#  Quests
# =====================================================================
# Three tracks, four quests each:
#   daily   - a fresh set every midnight, in the timezone below
#   weekly  - a fresh set every Friday at midnight
#   general - rolled once, never on a timer (refresh behaviour is TBD)
#
# When daily or weekly rolls a new set, every player's progress on that
# track is wiped. General progress is kept.
#
# Missing keys are merged in from the plugin's bundled copy on start, so
# edits here and later real quest content survive updates. Runtime state
# (which quests are active now, per-player progress) lives in
# quest-data.yml and is not meant to be hand-edited.
#
# quests-version is reserved for future migrations.
quests-version: 1

timing:
  # The zone the daily/weekly boundaries are measured in. "midnight EST" =
  # local midnight in US Eastern. The default tracks the EST/EDT change;
  # use a fixed offset like "-05:00" for hard EST with no daylight saving.
  timezone: America/New_York
  # How often (seconds) the server re-checks whether a boundary has passed.
  # A refresh missed while the server was offline is caught up on startup
  # regardless of this value.
  refresh-check-seconds: 60

# ---------------------------------------------------------------------
#  Quest pool
# ---------------------------------------------------------------------
# Each entry:
#   title       - shown as the item name
#   description - the objective, in words
#   objective   - kill_any (count mob kills) or deal_damage (sum damage dealt)
#   required    - the counter target
#   reward-xp   - dungeon XP granted on claim, toward class levelling. It is
#                 scaled by the player's current quest XP multiplier (below);
#                 on a dungeons-only server it falls back to vanilla XP.
#
# A refresh draws 4 at random from a track's pool (general takes the first
# 4 in file order). Pools may hold more than 4 once real content lands.
pool:
  daily:
    d_cull_the_horde:
      title: "Cull the Horde"
      description: "Slay 10 monsters."
      objective: kill_any
      required: 10
      reward-xp: 150
    d_bruiser:
      title: "Bruiser"
      description: "Deal 200 damage to monsters."
      objective: deal_damage
      required: 200
      reward-xp: 200
    d_exterminator:
      title: "Exterminator"
      description: "Slay 20 monsters."
      objective: kill_any
      required: 20
      reward-xp: 200
    d_heavy_hitter:
      title: "Heavy Hitter"
      description: "Deal 500 damage to monsters."
      objective: deal_damage
      required: 500
      reward-xp: 300

  weekly:
    w_weekly_slayer:
      title: "Weekly Slayer"
      description: "Slay 100 monsters this week."
      objective: kill_any
      required: 100
      reward-xp: 800
    w_devastation:
      title: "Devastation"
      description: "Deal 5000 damage this week."
      objective: deal_damage
      required: 5000
      reward-xp: 1000
    w_monster_hunter:
      title: "Monster Hunter"
      description: "Slay 250 monsters this week."
      objective: kill_any
      required: 250
      reward-xp: 1200
    w_onslaught:
      title: "Onslaught"
      description: "Deal 10000 damage this week."
      objective: deal_damage
      required: 10000
      reward-xp: 1500

  general:
    g_first_blood:
      title: "First Blood"
      description: "Slay your first monster."
      objective: kill_any
      required: 1
      reward-xp: 100
    g_getting_started:
      title: "Getting Started"
      description: "Slay 50 monsters."
      objective: kill_any
      required: 50
      reward-xp: 500
    g_warmup:
      title: "Warm-up"
      description: "Deal 1000 damage to monsters."
      objective: deal_damage
      required: 1000
      reward-xp: 500
    g_veteran:
      title: "Veteran"
      description: "Slay 500 monsters."
      objective: kill_any
      required: 500
      reward-xp: 1500

# ---------------------------------------------------------------------
#  XP multiplier
# ---------------------------------------------------------------------
# Once every quest in a track is complete (claimed or not) that track's
# factor below multiplies ALL dungeon XP the player earns - quest rewards
# and dungeon-completion XP alike. Daily and weekly stack; general never
# contributes. A track refreshing clears its quests, so the bonus drops on
# its own.
xp-multiplier:
  # How daily's and weekly's factors combine when both are complete:
  #   multiplicative - 1.10 * 1.20 = 1.32  (+32% dungeon XP)
  #   additive       - 1 + 0.10 + 0.20 = 1.30
  stacking: multiplicative
  daily: 1.10
  weekly: 1.20

# ---------------------------------------------------------------------
#  Menus
# ---------------------------------------------------------------------
# All text is MiniMessage. The selector is a single chest (27 slots); the
# category list is a double chest (54). Slots are 0-indexed.
menu:
  selector:
    title: "<gold>Quests"
    filler:
      enabled: true
      material: GRAY_STAINED_GLASS_PANE
    # Appended under each button's lore. <time> is the wait until that
    # category's next refresh ("2d 5h", "3h 12m", "8m", "under a minute").
    # Timed categories get refresh-timer-format; general gets no-refresh-text.
    refresh-timer-format: "<dark_gray>Next refresh: <gray><time>"
    no-refresh-text: "<dark_gray>No scheduled refresh."
    # Added to a button's lore (and the item glows) once every quest in that
    # category is done. complete-text is for daily/weekly (which grant the XP
    # bonus); complete-text-general for general (which doesn't).
    complete-text: "<green>✔ All complete - XP bonus active"
    complete-text-general: "<green>✔ All complete"
    # The XP-multiplier readout item. <value> is the current factor (e.g.
    # 1.88). Lore is generated: the per-track breakdown.
    multiplier:
      slot: 22
      material: EXPERIENCE_BOTTLE
      name: "<aqua>Dungeon XP Multiplier: <white>×<value>"
    daily:
      slot: 11
      material: PAPER
      name: "<yellow>Daily Quests"
      lore:
        - "<gray>Fresh set every midnight."
        - "<gray>Click to view."
    weekly:
      slot: 13
      material: MAP
      name: "<aqua>Weekly Quests"
      lore:
        - "<gray>Fresh set every Friday."
        - "<gray>Click to view."
    general:
      slot: 15
      material: FILLED_MAP
      name: "<red>General Quests"
      lore:
        - "<gray>Standing quests, no timer."
        - "<gray>Click to view."

  list:
    # <category> is replaced with Daily / Weekly / General.
    title: "<gold><category> Quests"
    filler:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
    # Four slots, one per quest. Needs at least 4 entries or the default is used.
    quest-slots: [19, 21, 23, 25]
    back:
      slot: 49
      material: ARROW
      name: "<yellow>Back"
    # The item shown per quest state. Names/lore are generated; only the
    # material is configurable here.
    state:
      in-progress:
        material: LIME_DYE
      complete:
        material: GOLD_INGOT
      claimed:
        material: GRAY_DYE
      missing:
        material: BARRIER

# ---------------------------------------------------------------------
#  In-world quest board (display entities)
# ---------------------------------------------------------------------
# A free-standing notice board, placed with /quests board place. Designed
# to be read from ~5 blocks; standing within activation-radius raises your
# interaction reach to click-range so the claim hitboxes work from there
# (this also extends melee reach while you stand there - keep boards away
# from combat).
#
# Page 0 = Daily (left column) + Weekly (right column); page 1 = General.
# The right/left arrows flip pages. All coordinates are in blocks, relative
# to the board's placement spot; X is along the board's width, Y is up.
board:
  view-range: 4.0
  activation-radius: 24.0
  click-range: 8.0
  brightness: 15
  # How often (seconds) a standing player's notes are rebuilt, so the
  # "Refreshes in ..." timers keep counting down.
  overlay-refresh-seconds: 30
  # Turn the whole board around in place if it renders mirrored.
  flip-facing: false
  remove-radius: 5.0
  cleanup-radius: 16.0
  backing:
    block: STRIPPED_SPRUCE_WOOD
    frame-block: STRIPPED_DARK_OAK_LOG
    width: 8.0
    height: 6.2
    depth: 0.3
    centre-y: 3.1
    frame-thickness: 0.35
  title:
    text: "<gradient:#e8c56a:#a5761f><bold>Quest Board</bold></gradient>"
    height: 5.4
    scale: 1.6
  # The XP-multiplier strip, under the title and above the columns.
  # <value> = the factor (1.32), <percent> = the bonus (32).
  multiplier:
    format: "<color:#c9a227>Dungeon XP Multiplier: <white>×<value> <gray>(+<percent>%)"
    height: 4.4
    scale: 0.6
  notes:
    # Distance of each column's centre from the board centre. Daily sits at
    # -column-x, Weekly at +column-x, General (page 1) is centred at 0.
    column-x: 2.05
    # Y of the top of the first note; each row drops by row-gap.
    top-y: 3.9
    row-gap: 0.95
    text-scale: 0.44
    line-width: 210
    # Standoff of text/arrows in front of the backing's front face.
    front-z: 0.06
    # ARGB parchment colours: normal, and when a quest is complete-unclaimed.
    paper: "D8C89A6B"
    paper-complete: "E6D9A441"
  # Per-card text. Placeholders: <category> <title> <time> <desc> <bar>
  # <current> <required>.
  card:
    title-format: "<color:#3b2a12><bold><category> Quest: <title>"
    timer-format: "<color:#6b5836>Refreshes in <time>"
    timer-none: "<color:#6b5836>No timed refresh"
    description-format: "<color:#3b2a12><desc>"
    bar-format: "<bar> <color:#3b2a12><current>/<required>"
    bar-fill: "<color:#c9a227>▰"
    bar-empty: "<color:#5b4a2e>▰"
    bar-segments: 10
    state-incomplete: "<color:#7a2d2d>✖ Not Completed"
    state-complete: "<color:#2e7d32><bold>✔ Completed!"
    state-claimed: "<color:#5b4a2e>✔ Claimed"
  arrows:
    right: "<color:#c9a227><bold>▶"
    left: "<color:#c9a227><bold>◀"
    scale: 1.8
    edge-x: 4.3
    height: 2.6
  hitboxes:
    note-width: 3.0
    note-height: 1.7
    arrow-width: 1.2
    arrow-height: 1.4
  sounds:
    page: UI_BUTTON_CLICK
    deny: BLOCK_NOTE_BLOCK_BASS
