# Pressure-plate trap floors, authored per room with YELLOW_WOOL markers.
# The trap kills deliberately: everything standing on the marked columns is
# killed the moment they drop, because letting a player fall out of a void
# world means losing control over what happens to them. Dying to it costs
# nothing but the walk back - dungeon respawns return to the entrance, and
# the door key is party state, so death cannot lose it.
trap:
  # How long the floor stays open before it is rebuilt, counted from the drop.
  floor-return-seconds: 4
  # Both timers start when the plate is stood on. The floor goes almost at
  # once; the death lands later, so the victim falls for a moment first.
  # Whoever stood on the floor when it went is remembered and killed wherever
  # they have fallen to, and anyone who walks in afterwards is caught by the
  # same moment - in a void world a fall has no ending of its own, so it is
  # never left to do the killing. Fractions are allowed.
  drop-delay-seconds: 0.4
  kill-delay-seconds: 3
  sounds:
    trigger: BLOCK_DISPENSER_FAIL
    collapse: BLOCK_GRAVEL_BREAK
    restore: BLOCK_STONE_PLACE

# The sealed corridor of a composed key branch. The barrier fills every
# passable block of the corridor mouth, so an authored corridor tile is
# sealed without touching its walls. It opens the moment the dungeon's key
# guardian dies; /dungeon door open forces it open for a stuck run.
door:
  material: IRON_BARS
  # Floating label centred on the barrier, facing the room it seals off.
  label:
    text: "<gradient:#c9a227:#f2e39b><bold>Sealed</bold></gradient><newline><color:#b3a577>Its key is guarded in the side passage"
    scale: 1.1
    # Standoff from the barrier towards the approaching player, in blocks.
    offset: 0.6
    brightness: 15
  sounds:
    deny: BLOCK_CHEST_LOCKED
    open: BLOCK_BEACON_ACTIVATE
  # Per-player pause between deny messages, in ticks.
  deny-message-interval-ticks: 60
  # How far a collapse may climb above a marked floor block. The column stops
  # at the first air gap by itself; this only caps how much of a tall pillar
  # can be dragged down, so a pillar reaching the ceiling cannot take the
  # ceiling with it. Set 0 for the floor blocks alone.
  max-column-height: 8
  # If the guardian room was woken but nothing lives there and no key was
  # granted, the guardian cannot drop the key any more - it is revived on its
  # anchor. After this many failed revivals the door opens by itself, because
  # a sealed dungeon nobody can finish is worse than a skipped fight.
  watchdog:
    interval-ticks: 100
    max-revivals: 2

