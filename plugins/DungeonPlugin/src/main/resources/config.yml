# =====================================================================
#  DungeonForge configuration
#  Everything here is live-editable: edit, save, /dungeon reload
# =====================================================================

config-version: 1

world:
  # Every dungeon world is this prefix + the player's name.
  # WARNING: on startup, every folder in the server root starting with this
  # prefix that is not currently loaded gets deleted. Pick something you do
  # not use anywhere else.
  prefix: "dungeon_"

  difficulty: NORMAL

  # Fixed time of day (0 = morning, 6000 = noon, 18000 = night)
  time: 18000

  clear-weather: true

  # Any valid vanilla gamerule may be listed here.
  gamerules:
    doDaylightCycle: false
    doWeatherCycle: false
    doMobSpawning: false
    doFireTick: false
    mobGriefing: false
    doMobLoot: true
    keepInventory: true
    announceAdvancements: false
    fallDamage: true
    # Dense mob groups should never damage or kill themselves before a
    # party arrives. This applies only to disposable dungeon worlds.
    maxEntityCramming: 0

box:
  size: 48
  origin:
    x: 0
    y: 64
    z: 0
  hollow: true
  material: STONE
  floor-material: STONE_BRICKS
  lights:
    enabled: true
    material: SEA_LANTERN
    spacing: 8

# Placeholder procedural dungeon generation. These boxes and tunnels will be
# replaced by prefab pasting in a later step, while retaining this layout logic.
generation:
  # The entrance room always starts at exactly this minimum corner for a
  # normal generated dungeon, regardless of seed or difficulty.
  entrance:
    origin:
      x: 0
      y: 64
      z: 0
    size:
      x: 35
      y: 18
      z: 35
    # The first corridor always leaves this face. Valid values: NORTH, SOUTH,
    # EAST, WEST. Later critical-path segments may still turn left or right.
    exit-direction: SOUTH

  # Counts include the fixed entrance and the final boss room. A difficulty
  # with a composition below ignores its entry here: its room count follows
  # from the composed path instead.
  rooms-per-difficulty:
    1: 4
    2: 5
    3: 6
    4: 7
    5: 8
    6: 9
    7: 10
    8: 11
    9: 12

  # A composed difficulty replaces random layout and marker-driven mob mixes
  # with an authored sequence. Each path entry names a room role between the
  # spawn room and the boss arena, in walking order. What a role spawns is
  # defined under mobs.room-roles; which prefab it prefers comes from the
  # role token in the schematic filename (normal_<role>_<shape>).
  # Difficulties without a composition keep the old behaviour untouched.
  composition:
    1:
      path: [swarm, pack, rest, swarm-champion, approach]
      # The composed path turns like any other, so corner and junction rooms
      # appear instead of one straight run. A role slot whose own prefab does
      # not exist in the required shape falls back to the generic pool, so
      # only turn this off if you want every role in exactly one shape.
      allow-turns: true
      # A mandatory detour: the corridor after path room door-after is sealed
      # until the guardian at the end of this branch dies. The branch leaves
      # the path room at from and its rooms are walked in order, so the
      # parkour sits between the main path and the key.
      key-branch:
        enabled: true
        from: 3
        door-after: 3
        rooms: [parkour, guardian]

  # Fallback dimensions used when no valid prefab exists for a slot. Loaded
  # room schematics are free to use their own dimensions; the generator plans
  # against the largest loaded footprint and places each room at its real size.
  prefab-room:
    size: { x: 67, y: 34, z: 67 }

  # Filename prefix chooses the eligible slot: normal_* is NORMAL only and
  # branch_* is BRANCH only. Empty export padding is trimmed automatically.
  rooms:
    markers:
      doorway:
        # One centred block or a contiguous centred strip on an outside wall.
        # DungeonForge finds the real air opening below the marker, then aligns
        # the flat corridor platform with that opening automatically.
        material: RED_WOOL
        description: "Marks a doorway wall; the air opening below it is detected automatically."
        minimum-opening-width: 3
        minimum-opening-height: 3
      entrance:
        # Placed exactly like a red doorway marker, but green pins the room's
        # orientation: the generator only uses rotations where players come
        # in through this opening. At most one green doorway per room, and it
        # needs at least one red doorway as the exit.
        material: GREEN_WOOL
        description: "Marks the doorway players must enter through; the room is rotated to honour it."
      trap-floor:
        # Mark only the visible walking-floor blocks. The wool is swapped for
        # a copy of its neighbouring floor at build time, so the trap is
        # invisible. Any pressure plate in a room with these markers becomes
        # the trigger.
        #
        # What falls is worked out from the marker: everything under it down
        # to the room's foundation, so the hole opens into the void, plus
        # everything standing on it - straight up through anything that is
        # not air, stopping at the first gap. A pillar or a step on a marked
        # block comes down with it without being marked; a platform floating
        # above the trap keeps its gap and stays put. /dungeon rooms reports
        # the resulting block count per file, so an over-eager column is
        # visible before testing in game.
        material: YELLOW_WOOL
        description: "A floor block that drops, taking whatever stands on it, when a pressure plate is stood on."
      player-spawn:
        # Place exactly one at the desired player feet position, with solid
        # ground directly below it. Players face the room's exit after removal.
        material: GRAY_WOOL
        description: "Marks the player arrival position in a spawn-room schematic."
      boss-spawn:
        # Optional: place one on the boss-room floor to choose the exact boss
        # position. Without it, DungeonForge finds clear floor nearest centre.
        material: LIGHT_BLUE_WOOL
        description: "Optionally marks the exact boss position in a boss-room schematic."
      replacements:
        # Combat spawn markers sit in open floor and disappear after loading.
        spawn: AIR
        # These are forced to air by the loader even if changed here: entities
        # now spawn at the marker's exact position.
        player-spawn: AIR
        boss-spawn: AIR
        # Doorway markers sit inside a wall. WALL_MATCHING copies a neighbouring
        # non-air wall block, so mixed stone/deepslate rooms keep their finish.
        doorway: WALL_MATCHING
        entrance: WALL_MATCHING
        # Trap floor wool becomes a copy of the floor around it, so the drop
        # zone cannot be read from the room.
        trap-floor: WALL_MATCHING
        # Purple wool in room files is reported as an old marker convention,
        # never interpreted as a champion marker, and removed from the build.
        legacy-purple: AIR

  room-variants:
    plain: { weight: 4 }
    # Retired in favour of the composed key branch, whose parkour role uses a
    # real branch_parkour_* prefab. The old variant produced an empty
    # procedural box, so it stays at 0 unless deliberately revived.
    parkour: { weight: 0 }
    # Regular room slots use schematics by default. A parkour variant remains
    # procedural until it has its own prefab format.
    allow-normal-parkour: false

  boss-room:
    min-size: { x: 63, y: 34, z: 63 }
    max-size: { x: 71, y: 40, z: 71 }

  corridor:
    # Legacy opening dimensions, still used by procedural rooms and doorway validation.
    inner-width: 7
    inner-height: 8
    # The placeholder corridor is a floor platform, not a tunnel. Width is
    # rounded up to odd so it stays centred on doorway markers.
    platform-width: 7
    floor-material: STONE
    safety-lips:
      enabled: true
      material: STONE
      height: 1
    # Space from one room wall to the next. It must leave room for a shaft.
    # A schematic tile with connector centres six blocks apart needs a multiple
    # of six here. The default 18 creates three joined tiles per corridor.
    length: 18
    schematic:
      # Files in plugins/DungeonForge/corridors/ are repeatable middle segments.
      # Purple groups are the two physical connectors. Cyan is a guide strip;
      # both are stored as metadata, then replaced while placing the tile.
      markers:
        connector:
          material: PURPLE_WOOL
          description: "A contiguous endpoint group that aligns exactly to a room doorway marker."
        guide:
          material: CYAN_WOOL
          description: "A corridor alignment guide between the two endpoint groups."
        replacements:
          connector: AIR
          guide: AIR
      # Procedural spawn, branch, boss, and fallback rooms have no red wool in
      # their source build. These virtual markers follow the standard prefab
      # marker-to-floor offset and let the same corridor tile connect to them.
      virtual-door-marker:
        width: 3
        height-above-floor: 30

  critical-path:
    # The main path holds a heading for this many rooms before it may turn.
    min-rooms-before-turn: 2
    max-rooms-before-turn: 4

  branching:
    # 0.0 = every room belongs to the critical path.
    # 1.0 = use every room beyond the minimum critical path as a side room.
    branch-frequency: 0.55
    # One branch may use this longer limit. A room directly off the critical
    # path has length 1, so the default permits one two-room detour.
    long-branch-max-length: 2
    # Every other branch uses this shorter limit.
    short-branch-max-length: 1
    # Includes the entrance and boss. Keeps the critical path meaningful even
    # when branch frequency is 1.0.
    minimum-critical-path-rooms: 4

  multi:
    # /dungeon generate <difficulty> <amount> [seed] is capped at this amount.
    max-amount: 64
    # Extra gap after the largest planned bounds when packing a generation grid.
    padding: 96

  # Extra clearance between room shells. Larger values make layouts spread out.
  room-padding: 2
  max-placement-attempts: 600

  # The comparison command uses a 3 by 3 arrangement with this extra gap.
  comparison:
    padding: 48

  # Placeholder shell materials, one colour per visible layout role.
  materials:
    entrance: MOSS_BLOCK
    normal-room: STONE
    branch: STONE
    corridor: COBBLESTONE
    boss: REDSTONE_BLOCK

party:
  max-size: 4
  invite-expiry-seconds: 60
  # An active party world is removed after this long when every occupant is offline.
  offline-instance-timeout-seconds: 600

rooms:
  # Periodic room detection avoids the high frequency of PlayerMoveEvent.
  detection-interval-ticks: 10

hunger:
  # Stops exhaustion, saturation loss, and food-level loss in every dungeon world.
  # Food gained by eating is still allowed.
  freeze-in-dungeons: true

combat:
  # Keeps party testing cooperative: player-caused melee, projectile, potion,
  # explosion, and custom DamageSource damage is cancelled in dungeon worlds.
  # It has no effect in ordinary server worlds.
  disable-player-damage-in-dungeons: true

death:
  # dungeon-entrance respawns inside the active dungeon; main-world-spawn is harsher.
  respawn-mode: dungeon-entrance

completion:
  # The party has this long to enjoy the victory scene before safe return and
  # world cleanup begin. The active instance remains locked during this time.
  grace-period-ticks: 160
  # Repeated forced-respawn attempts for anyone on the death screen when the
  # grace period ends. One tick is allowed between attempts.
  respawn-settle-attempts: 20
  title:
    fade-in-millis: 400
    stay-millis: 3000
    fade-out-millis: 600
  sound:
    type: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0

# Native Paper Dialog settings screen, opened with /dungeon settings by admins.
settings:
  title: "<dark_gray>DungeonForge <gold>Settings"
  home-description: "<gray>Select a settings category. Sliders show the valid range and current value."
  range-description: "<gray>Choose values within the displayed ranges, then save or reset this page."
  toggles-description: "<gray>Toggle simple runtime options, then save or reset this page."
  boolean-on: "On"
  boolean-off: "Off"
  pages:
    room-counts: "<gold>Room counts by difficulty"
    generation: "<gold>Generation dimensions and branching"
    mobs-low: "<gold>Mob counts and tiers: difficulties 1-5"
    mobs-high: "<gold>Mob counts and tiers: difficulties 6-9"
    toggles: "<gold>Runtime toggles"
  buttons:
    room-counts: "<green>Room counts"
    generation: "<green>Generation"
    mobs-low: "<green>Mobs 1-5"
    mobs-high: "<green>Mobs 6-9"
    toggles: "<green>Toggles"
    save: "<green>Save changes"
    reset: "<yellow>Reset this page"
    back: "<gray>Back"
  labels:
    room-count: "Difficulty <difficulty> room count"
    prefab-width: "Fallback prefab room width"
    prefab-height: "Fallback prefab room height"
    prefab-depth: "Fallback prefab room depth"
    corridor-length: "Corridor length"
    branch-chance: "Branch chance"
    short-branch: "Regular branch maximum depth"
    long-branch: "One long branch maximum depth"
    turn-min: "Minimum rooms before a path turn"
    turn-max: "Maximum rooms before a path turn"
    swarm-count: "Difficulty <difficulty> swarm group count"
    pack-count: "Difficulty <difficulty> pack group count"
    champion-count: "Difficulty <difficulty> champion group count"
    tier: "Difficulty <difficulty> mob tier"
    hunger: "Freeze hunger in dungeon worlds"
    party-pvp: "Disable player damage in dungeon worlds"
    spawn-room: "Spawn mobs in the spawn room"
    teleport-create: "Teleport after test/layout generation"

# Marker-driven combat groups. One marker always creates one complete group;
# no room rolls a named group or a random fallback.

# Combat rooms seal their exits while anything inside is alive; the boss
# arena seals its entrance for the fight. The way back is never sealed in a
# normal room, and a room with nothing alive in it never seals at all.
room-gating:
  enabled: true
  normal: true
  # Branch rooms: the parkour room has no mobs and the guardian's lair is
  # already governed by the sealed key door, so gating adds nothing there.
  branch: false
  # The boss spawns the moment every player stands in the arena, and the
  # entrance seals in the same breath. A wipe opens it; a full party seals it
  # again. Turning this off restores the old flow: the boss spawns on
  # approach and the arena never closes.
  boss: true
  # Fills only passable blocks of the doorway plane, so authored walls stay.
  # See-through on purpose: a player should see where they are going next.
  material: IRON_BARS
  # A sealed gate opens by itself after this long, whatever is still counted
  # alive. The failsafe of last resort; 0 disables it.
  timeout-seconds: 300
  glow-last-mobs:
    # The stragglers of a long-sealed room light up, so the fight ends at the
    # last mob instead of at a search party.
    enabled: true
    at-most: 2
    after-seconds: 30
  sounds:
    seal: BLOCK_IRON_DOOR_CLOSE
    open: BLOCK_IRON_DOOR_OPEN
    deny: BLOCK_CHEST_LOCKED

mobs:
  spawn-room: false
  spawn-per-tick: 4
  recount-interval-ticks: 40

  # Everything below multiplies the numbers in mobs.difficulties rather than
  # replacing them, so the per-difficulty table stays the place to shape one
  # band and this stays the place to move the whole game at once.
  scaling:
    # Applied to every configured health value, every category and the boss's
    # minions.
    health: 3.0
    # Extra health on top of `health`, for the three that should be walls
    # rather than merely tougher. Boss health is champion health times the
    # theme's health-multiplier, so the champion figure already reaches the
    # boss; boss-health-extra lands on top of that and compounds with it.
    # At 1.5 across the board a boss ends up 6.75x its old health.
    champion-health-extra: 1.5
    guardian-health-extra: 1.5
    boss-health-extra: 1.5
    # Group size. Only swarms double; pack, champion and guardian counts are
    # whatever mobs.difficulties says.
    swarm-count-multiplier: 2.0
    party:
      # multiplier = 1 + (players - 1) x factor. A factor of 1.0 is fully
      # linear - four players get four times as much. Below 1.0 each extra
      # player counts for less than a whole one, which is the point: a group
      # stacks damage better than mobs stack threat, so a linear rule makes
      # four players easier per head than one.
      #
      # Counts apply to swarm and pack, health to champion, guardian and boss.
      # Never both to one category: they multiply into total effective health
      # and a category with both outruns what the extra players bring.
      count-per-player: 0.6
      health-per-player: 0.75
      # Beyond this the multipliers stop growing.
      max-party-size: 8
      # A solo run is the baseline at x1.0. There is no solo discount: the
      # numbers in mobs.difficulties are the solo numbers, so tune those.
  boss-bars:
    # Appears when the first player enters the boss arena, then remains visible
    # to every player still inside that dungeon world.
    enabled: true
  markers:
    # These materials are consumed into room metadata immediately after the
    # build. They do not overlap any existing doorway marker system.
    # Champion moved off PURPLE_WOOL: purple doubles as the corridor connector
    # marker and was never readable inside a room because of it.
    materials: { swarm: LIME_WOOL, pack: ORANGE_WOOL, champion: MAGENTA_WOOL, guardian: BLACK_WOOL }
    descriptions:
      swarm: "Spawns one fast, low-health swarm group around this marker."
      pack: "Spawns one resilient group of solid enemies around this marker."
      champion: "Spawns one slow, heavy champion around this marker."
      guardian: "Spawns the key guardian of a composed dungeon around this marker."
    # A group forms around its own marker. Failed points widen only as far as
    # maximum-group-radius so the result remains clearly tied to that marker.
    group-radius: 5
    # Raised with the doubled swarms and party scaling: a nine-block ring holds
    # roughly 85 members at the distance below, and a full party on difficulty
    # 9 asks for close to seventy.
    maximum-group-radius: 12
    minimum-group-distance: 1.75
    outward-search-step: 2
    attempts-per-ring: 20
    generated:
      # Placeholder stone rooms receive markers procedurally. Hand-built
      # prefabs already contain their own markers and use the same scanner.
      minimum-distance: 8
      doorway-clearance: 5
      edge-clearance: 3
      placement-attempts: 100
      per-difficulty:
        1: { swarm: 1, pack: 0, champion: 0 }
        2: { swarm: 1, pack: 1, champion: 0 }
        3: { swarm: 1, pack: 1, champion: 0 }
        4: { swarm: 1, pack: 1, champion: 1 }
        5: { swarm: 1, pack: 1, champion: 1 }
        6: { swarm: 1, pack: 1, champion: 1 }
        7: { swarm: 1, pack: 1, champion: 1 }
        8: { swarm: 1, pack: 1, champion: 1 }
        9: { swarm: 1, pack: 1, champion: 1 }
  # What one composed room role spawns: category -> number of complete groups.
  # Group sizes and stats stay under mobs.difficulties.<d>.categories. A
  # marker of a matching colour in the chosen prefab anchors a group at its
  # own spot; roles needing more groups than the prefab marks get anchors on
  # clear floor found at runtime, deterministic per seed. An empty role
  # spawns nothing - the pause is the point.
  room-roles:
    swarm:          { swarm: 1 }
    pack:           { pack: 1 }
    rest:           {}
    swarm-champion: { swarm: 1, champion: 1 }
    approach:       {}
    parkour:        {}
    guardian:       { guardian: 1 }
  boss-summoning:
    # The sequence begins when a player enters the boss room. It always
    # completes, even if the arena becomes empty, so minions cannot remain
    # pending forever. The boss is invulnerable during it by default.
    duration-ticks: 60
    hold-ticks: 15
    pulse-interval-ticks: 5
    particle: SOUL_FIRE_FLAME
    particle-count: 18
    particle-radius: 1.5
    particle-height: 1.5
    start-sound: ENTITY_WITHER_AMBIENT
    peak-sound: ENTITY_WITHER_SPAWN
    sound-volume: 2.0
    sound-pitch: 1.0
    invulnerable: true
    # Scripted entrance replacing the default particle pulse. Known values:
    # rift_tear, none. A theme may override this in its own summoning block.
    animation: none
    animations:
      # The Rift Devourer's entrance. A tear of block displays opens in the
      # floor, its shards orbit and lean inward, and the boss is dragged up out
      # of the ground. Nothing here touches the world: it is all display
      # entities whose transformations the client interpolates between.
      rift_tear:
        shard-material: CRYING_OBSIDIAN
        disc-material: OBSIDIAN
        shards: 8
        radius: 3.2
        shard-width: 0.35
        shard-height: 2.4
        orbit-degrees-per-second: 70.0
        # Grows the ring and the burial depth with the boss's SCALE attribute,
        # so a scaled-up boss does not dwarf its own entrance.
        scale-with-boss: true
        # Raising the boss out of the floor. Ignored unless the summoning
        # sequence is invulnerable, because a buried boss must not be hurt.
        rise: true
        rise-depth: 3.5
        particle: REVERSE_PORTAL
        ambient-sound: BLOCK_PORTAL_AMBIENT
        emerge-sound: ENTITY_WARDEN_EMERGE
        glow-colour: "8A2BE2"
  boss-minions:
    # Ring positions find their own floor beneath the boss platform before
    # checking clearance, so uneven boss arenas remain safe to use.
    floor-search-down: 12
    alternate-search-radius: 16
  parkour-rooms:
    # Parkour is traversal first: leave it peaceful unless explicitly enabled.
    spawn-mobs: false
  # Leave this empty for normal vanilla names. Available tags: <tier>, <role>, <mob>.
  name-format: ""
  name-visible: false

  # All dungeon-mob drops are cleared on death. Experience is set per
  # difficulty below; zero is the default until the gameplay economy is ready.
  safety:
    cancel-vex-spawns: true
    prevent-dungeon-mob-teleport: true
    # Endermen remain recognisable, but every teleport source is confined to
    # their registered room so they cannot escape a sealed room.
    constrain-enderman-teleport: true
    # Prevents the damage-avoidance escape that makes endermen immune to
    # projectiles. Their ordinary teleports remain confined to their room.
    prevent-enderman-damage-escape: true
    # Breezes normally deflect player projectiles. Dungeon breezes take a
    # regular ranged hit instead, using the projectile's native damage.
    disable-breeze-projectile-deflection: true
    prevent-enderman-block-changes: true
    prevent-zombification: true

  # The room spawn search checks this much clear space before creating a mob.
  # Large mobs are therefore placed only in rooms where they fit.
  entity-clearance:
    default: { width: 1, height: 2 }
    WITHER_SKELETON: { width: 1, height: 3 }
    RAVAGER: { width: 3, height: 4 }
    GHAST: { width: 5, height: 5 }
    SHULKER: { width: 1, height: 3 }
    IRON_GOLEM: { width: 2, height: 3 }
    WARDEN: { width: 2, height: 3 }

  # Theme bands: Crypt (1-2), Nest (3-4), Nether Redoubt (5-6),
  # Illager Citadel (7-8), and Rift (9). Types and visible names belong to a
  # theme; category stats and group counts are below per difficulty.
  themes:
    crypt:
      categories:
        swarm: { entity: ZOMBIE, name: "<gray>Shambler", name-visible: true }
        pack: { entity: SKELETON, name: "<gray>Gravewatch", name-visible: true }
        champion: { entity: ZOMBIE, name: "<dark_gray>Bonelord", name-visible: true }
        guardian: { entity: SKELETON, name: "<dark_gray>Gravekeeper", name-visible: true }
      boss:
        type: ZOMBIE
        name: "<dark_gray>Crypt Colossus"
        name-visible: true
        health-multiplier: 2.5
        bar-color: WHITE
        minion-count: 3
        minion-name: "<gray>Crypt Boneguard"
        minion-name-visible: true
        minions: [SKELETON]
        minion-gap: 0.35
        minion-minimum-separation: 2.5
        summoning: { start-sound: ENTITY_ZOMBIE_AMBIENT, peak-sound: ENTITY_ZOMBIE_AMBIENT }
    nest:
      categories:
        swarm: { entity: CAVE_SPIDER, name: "<dark_green>Broodling", name-visible: true }
        pack: { entity: SPIDER, name: "<dark_green>Weaver", name-visible: true }
        champion: { entity: SPIDER, name: "<dark_green>Matriarch", name-visible: true }
        guardian: { entity: SPIDER, name: "<dark_green>Broodkeeper", name-visible: true }
      boss:
        type: SPIDER
        name: "<dark_green>Nest Matriarch"
        name-visible: true
        health-multiplier: 2.5
        bar-color: GREEN
        minion-count: 3
        minion-name: "<dark_green>Venom Weaver"
        minion-name-visible: true
        minions: [CAVE_SPIDER]
        minion-gap: 0.35
        minion-minimum-separation: 2.5
        summoning: { start-sound: ENTITY_SPIDER_AMBIENT, peak-sound: ENTITY_SPIDER_AMBIENT }
    nether-redoubt:
      categories:
        swarm: { entity: MAGMA_CUBE, name: "<gold>Ember Spawn", name-visible: true }
        pack: { entity: PIGLIN_BRUTE, name: "<gold>Ashguard", name-visible: true }
        champion: { entity: PIGLIN_BRUTE, name: "<gold>Cinderbrute", name-visible: true }
        guardian: { entity: PIGLIN_BRUTE, name: "<gold>Vaultwarden", name-visible: true }
      boss: { type: HOGLIN, name: "<gold>Redoubt Behemoth", name-visible: true, health-multiplier: 2.5, bar-color: RED, minion-count: 0, minions: [] }
    illager-citadel:
      categories:
        swarm: { entity: PILLAGER, name: "<blue>Rabble", name-visible: true }
        pack: { entity: VINDICATOR, name: "<blue>Warband", name-visible: true }
        champion: { entity: RAVAGER, name: "<blue>Warcaller", name-visible: true }
        guardian: { entity: VINDICATOR, name: "<blue>Keywarden", name-visible: true }
      boss:
        type: IRON_GOLEM
        name: "<blue>Citadel Warden"
        name-visible: true
        health-multiplier: 2.5
        bar-color: BLUE
        minion-count: 3
        minion-name: "<blue>Citadel Copper Sentinel"
        minion-name-visible: true
        minions: [COPPER_GOLEM]
        minion-gap: 0.35
        minion-minimum-separation: 2.75
