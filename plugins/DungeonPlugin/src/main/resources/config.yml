# Dungeon Lords are persistent, stationary menu-opening NPCs. Their individual
# positions and entity UUIDs are stored separately in plugins/DungeonForge/npcs.yml.
npc:
  entity-type: VILLAGER
  display-name: "<gold><bold>Dungeon Lord"
  name-visible: true
  # /dungeon npc remove removes the nearest Dungeon Lord inside this radius.
  remove-radius: 5.0

# =====================================================================
#  Difficulty panel
# =====================================================================
# /dungeon panel place puts a fixed difficulty selector in the world at your
# spot, facing the way you face. It is furniture, not a summoned menu: it is
# always standing there, players cannot move it, and it survives restarts.
# Its entities are never written into the world save - they respawn from
# panels.yml whenever their chunk loads, so they cannot duplicate.
# /dungeon and the Dungeon Lord now point players at the nearest panel.
# Part one renders the shared static panel; selection and clicks come next.
# Text uses Minecraft's own font, the same one chat uses; every string below
# is MiniMessage, so the DungeonForge chat gradient works here too.
difficulty-panel:
  # /dungeon panel remove removes the nearest panel inside this radius.
  remove-radius: 5.0
  # Fixed light level 0-15, so the panel stays readable at night.
  brightness: 15
  # Multiplies how far away the panel is still sent to clients. Beyond it the
  # panel stops being rendered entirely rather than degrading; a player's own
  # Entity Distance video setting scales this further.
  view-range: 2.0
  # How far around a panel to sweep for its own and orphaned entities when it
  # is rebuilt or removed, in blocks.
  cleanup-radius: 12.0
  # Set true if a placed panel reads mirrored from where you expect to
  # stand; it turns the whole panel around in place.
  flip-facing: false
  # How close a player must be for their personal number row to exist. The
  # selection itself survives walking away; only the rendering follows range.
  activation-radius: 24.0
  # Client-side slide of the row when scrolling, in ticks.
  slide-ticks: 4
  # Clickable regions are deliberately larger than the text they cover:
  # aiming a crosshair is less precise than a mouse pointer.
  hitboxes:
    arrow-width: 1.3
    arrow-height: 1.3
    button-width: 2.6
    button-height: 1.0
  # Heard only by the player who clicked. Blank disables a sound.
  sounds:
    click: UI_BUTTON_CLICK
    deny: BLOCK_NOTE_BLOCK_BASS
    enter: BLOCK_NOTE_BLOCK_PLING
  heading:
    text: "<gradient:#c9a227:#f2e39b><bold>Select Difficulty"
    height: 2.7
    scale: 1.5
  # The text floats against the world: there is deliberately no backing plate.
  numbers:
    height: 1.72
    # Horizontal distance between neighbouring numbers, in blocks.
    spacing: 0.55
    # Extra breathing room either side of the enlarged centre number.
    centre-extra: 0.18
    visible-each-side: 2
    # Centre outward: the selected number first, then each step further away.
    scales: [2.8, 1.6, 1.0]
    opacities: [255, 165, 85]
    format: "<color:#f2e39b><bold><n>"
  arrows:
    left: "<color:#c9a227><bold><"
    right: "<color:#c9a227><bold>>"
    # Distance from the centre of the panel, in blocks.
    offset: 2.2
    height: 1.75
    scale: 2.4
  button:
    # The gradient lives in the label, exactly like the chat prefix: a
    # text-display background is one flat colour and cannot hold a gradient.
    text: "<gradient:#c9a227:#f2e39b><bold>Enter Dungeon"
    height: 1.0
    scale: 1.4
    flash-ticks: 3
    # The plate is built from block displays, not from text backgrounds: a
    # dark fill layer over a gold border layer, each made of three
    # overlapping bars so all four corners step inwards twice. Block
    # displays show a block texture rather than a flat colour, so concrete
    # is the closest thing to a clean fill.
    plate:
      fill-block: BLACK_CONCRETE
      border-block: YELLOW_CONCRETE
      # Swapped in for a moment when the button is pressed.
      flash-block: BROWN_CONCRETE
      # Space between the label and the fill's edge.
      padding-pixels: 4.0
      # Thickness of the border, the same on every side.
      border-pixels: 2.0
      # How far each corner steps in, per step. Two steps are used, so the
      # corner is cut by twice this. Set to 0 for square corners.
      corner-step-pixels: 2.0
      # Height of one line of text plus its background padding, in pixels.
      # Only affects how tall the plate is; the border stays even either way.
      line-height-pixels: 11.0
      # Font pixels per block at scale 1. Everything above is measured in
      # these, so the shape stays proportional to the label.
      pixels-per-block: 40.0
      # Thickness of the plate itself and how far each layer stands off the
      # panel, in blocks. The bars are centred on their offset, so each one
      # spans half its depth either side: these values keep the border
      # (0.000-0.020) and the fill (0.021-0.041) from overlapping, which
      # would make the ring z-fight.
      depth: 0.02
      border-z: 0.010
      fill-z: 0.031
      # How far the label stands in front of the fill's front face. The bars
      # are solid blocks that write depth, so a label level with them is
      # hidden from close up and only breaks through at a distance.
      label-clearance: 0.015
      # Centring the label inside the plate, in font pixels.
      # A text display draws its line upwards from its own position while the
      # plate is centred on it, so the label is moved down by half a line:
      # raise this if the label sits high, lower it if it sits low.
      label-y-pixels: 4.5
      # Sideways nudge. A centred line includes the one pixel of spacing that
      # follows its last glyph, which leaves the visible text half a pixel to
      # the left; this puts it back.
      label-x-pixels: 0.5
      # Nudge the whole plate up or down against the label, in blocks.
      y-offset: 0.0

# =====================================================================
#  Skill tree panel
# =====================================================================
# /dungeon skills place [class] [standard|big] puts a fixed skill tree in the
# world at your spot, facing your way: a fan of three branches around a root,
# built from display entities like the difficulty panel. The trees themselves
# are authored in skills.yml.
#
# TWO VARIANTS. The chosen one is stored with the panel and survives restarts.
#   standard - about 7 x 5 blocks, for walking up to. Every size below applies.
#   big      - about 19 x 12 blocks, for a wall you stand back from. Its sizes
#              are fixed in code and it IGNORES every size key below: spacing,
#              scales, line thickness, hitboxes, layer depths and the detail
#              panel are all baked into the variant. Colours, blocks, glyph
#              formats and the three-state ladder are shared by both.
skill-panel:
  remove-radius: 5.0
  cleanup-radius: 14.0
  brightness: 15
  # How far the panel renders, as a multiplier of the client's default
  # display range (1.0 is roughly 64 blocks; the player's own Entity
  # Distance setting scales it further). The SAME value is stamped on the
  # shared tree and on every per-player overlay, so there is no distance
  # where the tree is visible but your own progress on it is not.
  view-range: 2.0
  # The vanilla client only registers a click on an entity within the
  # player's entity-interaction-range attribute, about 3 blocks - that is
  # the hard limit, and it can only be moved, not bypassed. While a player
  # stands inside activation-radius of a skill panel it is raised to this
  # many blocks so nodes and buttons stay clickable from where the big
  # panel is comfortably readable. Honest side effect: their melee reach
  # on mobs is extended by the same amount while they stand there, so keep
  # panels out of combat areas. 0 disables the boost.
  click-range: 20.0
  # Turns the whole panel around in place if it reads mirrored.
  flip-facing: false
  # Height of the root node above the placement spot, in blocks.
  root-height: 0.9
  # Blocks per ring of radius in skills.yml. The whole tree scales with it.
  radius-step: 0.75
  heading:
    # Above the outermost ring.
    height-extra: 0.9
    scale: 1.5
  branch-labels:
    scale: 0.9
  # How close a player must be for their personal overlays - unlocked and
  # available highlights, selection ring, detail panel - to exist.
  activation-radius: 30.0
  # Node click surfaces. They are deliberately larger than the visible dots,
  # and overlap between neighbours is harmless: a click is re-resolved to the
  # node nearest the player's line of aim, so whichever box catches it, the
  # node being aimed at wins. Beyond aim-tolerance blocks from every node the
  # click is ignored.
  hitboxes:
    node-width: 0.5
    node-height: 0.5
    aim-tolerance: 0.8
  sounds:
    # Heard only by the player who clicked. Blank disables it.
    select: UI_BUTTON_CLICK
  nodes:
    scale: 1.6
    # Three states, tuned by eye against your background: unlocked is the
    # brightest, available mid, locked clearly dimmest. The circle glyphs
    # come from Minecraft's own font; colours and opacities are free.
    unlocked-format: "<color:#f2e39b>●"
    unlocked-opacity: 255
    available-format: "<color:#c9a227>●"
    available-opacity: 230
    locked-format: "<color:#6b6353>●"
    locked-opacity: 140
    # The selection ring, drawn per player on the node they clicked.
    # Standard variant only; the big variant uses the selection plate below.
    ring-format: "<color:#f2e39b>○"
    ring-scale: 2.2
    # BIG VARIANT ONLY. Nodes there are raised plates instead of glyphs: a
    # wide base standing behind a smaller, thicker top, so a node reads as a
    # button with a rim. Both plates face the viewer, so the rim only shows
    # when base and top differ - same block at the same brightness renders as
    # one flat square. The rim is therefore a duller relative of the face.
    #
    # The ladder matches the rest of the panel: hue separates locked from the
    # rest, brightness separates unlocked from available. Brightness is an
    # emissive override (0-15), so it reads the same by day and by night.
    plates:
      unlocked:  { base-block: RAW_GOLD_BLOCK, base-brightness: 11, top-block: GOLD_BLOCK, top-brightness: 15 }
      available: { base-block: RAW_GOLD_BLOCK, base-brightness: 5,  top-block: GOLD_BLOCK, top-brightness: 8 }
      locked:    { base-block: DEEPSLATE_TILES, base-brightness: 3, top-block: GRAY_CONCRETE, top-brightness: 6 }
      # The selected node gets a larger plate behind it, showing as a bright
      # border all the way around. A glyph ring would land on top of a solid
      # plate and read as noise.
      selection: { block: GOLD_BLOCK, brightness: 15 }
  lines:
    thickness: 0.06
    depth: 0.02
    # Standoff from the panel plane; nodes draw in front of lines.
    z: 0.015
    # The rotation sign of angled bars in entity-local space cannot be
    # verified without a client. If every diagonal line misses its nodes
    # mirrored left-right, set this true instead of waiting for a rebuild.
    mirror: false
    # The three line states: block and emissive brightness (0-15) each.
    # The base tree is drawn entirely in the locked style; brighter lines
    # are per-player overlays on top of it.
    unlocked: { block: GOLD_BLOCK, brightness: 15 }
    available: { block: SMOOTH_QUARTZ, brightness: 11 }
    locked: { block: GRAY_CONCRETE, brightness: 5 }
  # BIG VARIANT ONLY. The standing Info area left of Confirm. It always
  # shows something: the selected node's details (detail.format below), or -
  # when nothing is selected - this class summary, so a player always knows
  # what Confirm would commit.
  info:
    format: "<name><newline><color:#b3a577><description><newline><color:#c9a227>Active class: <active><newline><color:#c9a227>Unlocked here: <unlocked>"
  # Where the Confirm button used to stand there is now the viewer's own
  # point balance. Text, not a button - there is nothing to click, and class
  # switching happens outside this panel entirely. Zero is shown as a plain
  # 0 rather than hidden: an empty space where a figure belongs reads as
  # broken. Set background to a solid ARGB to give it a backdrop.
  # Placeholders: <points> available, <spent> paid into nodes, <budget> the
  # level-derived pool ClassSkills reports (0 without it). Available is
  # always budget + granted - spent, so it can never disagree with what the
  # tree says was bought.
  points:
    format: "<color:#b3a577>Skill Points<newline><gradient:#c9a227:#f2e39b><bold><points>"
    scale: 1.4
    background: "00000000"
  # The per-player panel beside the tree showing the selected node.
  detail:
    # Blocks right of the tree's centre; negative places it on the left.
    x: 3.9
    height: 2.4
    scale: 0.55
    # Text pixels before the description wraps.
    line-width: 170
    # ARGB backdrop behind the text, so it reads on any background.
    background: "A0140F05"
    format: "<gradient:#c9a227:#f2e39b><bold><name></bold></gradient><newline><color:#c9a227>Cost: <cost> point(s)<newline><color:#b3a577><description><newline><color:#c9a227>Level <level>/1"

# =====================================================================
#  Custom mob models (optional)
# =====================================================================
# Vanilla mob models cannot be animated from a plugin: the client owns them.
# A model engine works around that by hiding the real mob and rendering an
# animated rig of display entities in its place. DungeonForge supports
# BetterModel (free, Paper, Minecraft 1.21.4-26.1.x, Java 25).
#
# Install BetterModel, drop your .bbmodel files in its models folder, then put
# the model name here. BetterModel generates and serves the resource pack; if
# you already serve your own pack you must merge the two into one.
# Without BetterModel installed every value below is simply ignored and mobs
# keep their vanilla look. Check what is wired up with /dungeon models.
models:
  enabled: true
  # Hides the vanilla mob itself. Its AI, pathfinding, hitbox and damage all
  # keep working - only its appearance is replaced by the model.
  hide-vanilla-entity: true
  # Follows the SCALE attribute this plugin sets per difficulty, so a scaled
  # boss keeps its model in proportion.
  scale-with-entity: true
  animations:
    # Animation played once the moment a dungeon mob spawns. Blank for none.
    spawn: ""
  # Used when a theme below leaves its entry blank.
  defaults:
    boss: ""
    categories: { swarm: "", pack: "", champion: "" }
  # Model names per theme, matching the mobs.themes section above.
  themes:
    crypt:
      boss: ""
      categories: { swarm: "", pack: "", champion: "" }
    nest:
      boss: ""
      categories: { swarm: "", pack: "", champion: "" }
    nether-redoubt:
      boss: ""
      categories: { swarm: "", pack: "", champion: "" }
    illager-citadel:
      boss: ""
      categories: { swarm: "", pack: "", champion: "" }
    rift:
      boss: ""
      categories: { swarm: "", pack: "", champion: "" }

performance:
  # Positions processed per server tick. Higher is faster but heavier.
  blocks-per-tick: 60000

teleport:
  # Teleport into the dungeon right after /dungeon test, generate, or compare
  on-create: true
  # Where players end up when they leave or get evacuated.
  #   last  - wherever they stood before entering
  #   spawn - the spawn of the main world
  fallback: last

