# ============================================================
#  Version settings - this is the only file you need to touch
# ============================================================

# The paper-api version you compile against.
# Find current build numbers at:
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/
#
#   MC 26.1.2   ->  26.1.2.build.74-stable   (apiVersion 26.1.2, Java 25)
#   MC 26.2     ->  26.2.build.87-stable     (apiVersion 26.2,   Java 25)
#   MC 1.21.11  ->  1.21.11-R0.1-SNAPSHOT    (apiVersion 1.21,   Java 21)
paperApiVersion=26.1.2.build.74-stable

# Must match the Minecraft version above. Ends up in plugin.yml.
# For the older 1.21.x line this is simply "1.21".
# To check: open the paper-api jar as a zip and read apiVersioning.json.
apiVersion=26.1.2

# Java version the server runs on. MC 26.x needs 25, MC 1.21.x needs 21.
# Gradle downloads this JDK automatically if you don't have it.
javaVersion=25

# Which Paper version ./gradlew runServer starts.
runPaperVersion=26.1.2

# BetterModel supplies custom mob models and animations. It is optional at
# runtime: without the plugin installed every mob keeps its vanilla look.
# Supports Minecraft 1.21.4 - 26.1.x and needs Java 25, same as this project.
betterModelVersion=3.3.0

pluginGroup=nl.riddernix
pluginVersion=0.10.0

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
